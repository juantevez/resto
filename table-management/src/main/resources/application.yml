server:
  port: 8081
  tomcat:
    threads:
      # Aunque usemos Virtual Threads, limitamos el máximo de conexiones concurrentes
      # para proteger la memoria del SO si hubiera una saturación extrema.
      max-connections: 10000

spring:
  application:
    name: table-management-service

  # --- VIRTUAL THREADS (JAVA 21) ---
  threads:
    virtual:
      enabled: true # Esta es la propiedad mágica que activa Project Loom en Spring Boot 3.2+

  # --- DATABASE (POSTGRESQL) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/restaurant_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
    # Configuración del Pool (Hikari)
    hikari:
      maximum-pool-size: 20 # Con Virtual Threads, el cuello de botella suele ser el pool de conexiones a la DB

  # --- JPA / HIBERNATE ---
  jpa:
    hibernate:
      ddl-auto: validate # Flyway se encarga de la creación, Hibernate solo valida
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # --- FLYWAY (MIGRACIONES) ---
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# --- LOGGING ---
logging:
  level:
    root: INFO
    com.restaurant.table: DEBUG
    # Para ver cómo se comportan los hilos (útil para debuguear Virtual Threads)
    org.apache.tomcat.util.threads: DEBUG
